<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan — Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dienstplan.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="authOverlaySlot"></div>

    <div class="page-header-bar">
        <span id="pageGreeting" class="page-greeting">Loading…</span>
        <div class="page-header-clock">
            <span id="pageClockDate"></span><span id="pageClockTime"></span>
        </div>
    </div>
    <div id="pageNavigation" data-page="manager"></div>

    <div class="table-container detail-card">

        <div class="reservation-header">
            <div class="header-title"><h3>Manager</h3></div>
            <div class="header-center"></div>
            <div class="header-right"></div>
        </div>

        <div class="dash-stack">

            <!-- Pending Approvals -->
            <section class="dash-section">
                <h3>Pending Approvals</h3>
                <div id="approvalsList"></div>
            </section>

            <!-- Complaints -->
            <section class="dash-section">
                <h3>Complaints</h3>
                <div id="complaintsList"></div>
            </section>

            <!-- Leave Requests -->
            <section class="dash-section">
                <h3>Leave Requests</h3>
                <div id="leaveList"></div>
            </section>

            <!-- Add Crew Member -->
            <section class="dash-section">
                <h3>Add Crew Member</h3>
                <p class="plan-entry-meta" style="margin-top:0;">
                    Members appear on the roster immediately. Login accounts can be
                    provisioned later by the Admin — until then their status shows
                    “login not set up”.
                </p>
                <div class="manager-form-row manager-required" style="margin-top:10px;">
                    <input type="text" id="addCrewName"
                        placeholder="Full name">
                    <input type="email" id="addCrewEmail"
                        placeholder="Email (for login later)">
                    <select id="addCrewRole">
                        <option value="employee">Crew</option>
                        <option value="manager">Chief/Bos</option>
                    </select>
                    <input type="number" id="addCrewHours"
                        placeholder="Weekly hours (e.g. 40)">
                    <button onclick="panels.addCrewMember()">Add</button>
                </div>
            </section>

            <!-- Crew Members -->
            <section class="dash-section">
                <h3>Crew Members</h3>
                <div id="crewList"></div>
            </section>

        </div>

    </div>

    <!-- EDIT CREW MODAL -->
    <div id="crewEditModal" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal">
            <h3>Edit Crew Member</h3>
            <input type="hidden" id="editCrewId">
            <label>Full name</label>
            <input type="text" id="editCrewName">
            <label>Weekly target hours</label>
            <input type="number" id="editCrewHours">
            <label>Role</label>
            <select id="editCrewRole">
                <option value="employee">Crew</option>
                <option value="manager">Chief/Bos</option>
            </select>
            <label>Email (for login &amp; recovery)</label>
            <input type="email" id="editCrewEmail">
            <div class="plan-modal-footer">
                <button onclick="closeModal('crewEditModal')">Cancel</button>
                <button class="primary" onclick="saveCrewEdit()">Save</button>
            </div>
        </div>
    </div>

    <!-- MANUAL TIME EDIT MODAL -->
    <div id="manualEditModal" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal">
            <h3>Set Time Manually</h3>
            <input type="hidden" id="manualEditEntryId">
            <label>Clock In</label>
            <input type="datetime-local" id="manualClockIn">
            <label>Clock Out</label>
            <input type="datetime-local" id="manualClockOut">
            <label>Manager note (shown to employee)</label>
            <textarea id="manualEditNote" placeholder="Explain the adjustment"></textarea>
            <div class="plan-modal-footer">
                <button onclick="closeModal('manualEditModal')">Cancel</button>
                <button class="primary" onclick="submitManualEdit()">Save</button>
            </div>
        </div>
    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>
    <script type="module" src="dist/dienstplan.js"></script>
    <script type="module" src="dist/panels.js"></script>

</body>
</html>
