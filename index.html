<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan — Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dienstplan.css">
</head>
<body>

    <h1 id="orgNameLabel">Loading…</h1>
    <div id="pageNavigation" data-page="dashboard"></div>

    <div class="table-container detail-card">

        <div class="reservation-header">
            <div class="header-title"><h3>Dashboard</h3></div>
            <div class="header-menu"></div>
            <div class="header-clock"><span id="clock"></span></div>
        </div>

        <div class="dash-stack">

            <!-- CARD: My Shift -->
            <section class="dash-section">
                <h3>My Shift</h3>
                <div id="shiftStrip" class="shift-strip">
                    <p class="plan-entry-meta" style="margin:0;">Loading…</p>
                </div>
            </section>

            <!-- CARD: Attendance -->
            <section class="dash-section">
                <h3 id="attTitle">Check In</h3>
                <p id="attSub" class="plan-entry-meta" style="margin-top:2px;">Locating you…</p>

                <div id="map" class="att-map"></div>

                <div class="att-info">
                    <div>
                        <span class="plan-entry-meta">Role</span>
                        <select id="attRole" disabled></select>
                    </div>
                    <div>
                        <span class="plan-entry-meta">Scheduled</span>
                        <strong id="attHours">–</strong>
                    </div>
                    <div>
                        <span class="plan-entry-meta">Elapsed</span>
                        <strong id="attTimer">00:00:00</strong>
                    </div>
                </div>

                <label class="att-label" for="attComment">Comment (optional)</label>
                <textarea id="attComment" rows="2"
                    placeholder="e.g. forgot to check in earlier…"></textarea>

                <button id="attBtn" class="att-btn">Check In</button>
            </section>

            <!-- CARD: History -->
            <section class="dash-section">
                <h3>Recent Entries</h3>
                <div id="myEntriesList"></div>
            </section>

        </div>

    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>
    <script type="module" src="dist/dienstplan.js"></script>
    <script type="module" src="dist/panels.js"></script>
    <script type="module" src="dist/dashboard.js"></script>

</body>
</html>
