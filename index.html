<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan — Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dienstplan.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- LOGIN OVERLAY (static so there is no flash of app content;
         removed by auth.ts once a session is detected) -->
    <div id="loginOverlay" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal auth-card">

            <h3>Dienstplan Login</h3>

            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="username">

            <label>Password</label>
            <div class="auth-pass-row">
                <input type="password" id="authPassword" autocomplete="current-password">
                <button type="button" class="auth-eye" id="authEyeBtn"
                    title="Show / hide password"
                    aria-label="Show password"></button>
            </div>

            <div class="auth-actions-row">
                <label class="auth-check">
                    <input type="checkbox" id="authRemember" checked>
                    <span>Remember me on this device</span>
                </label>
                <button class="primary" id="authLoginBtn">Log in</button>
            </div>

            <div id="authError" class="auth-error" style="display:none;"></div>

            <p class="auth-hint">No account yet? Please ask your admin / boss, or
                <a href="#" id="ownerToggle">register your business</a> ·
                <a href="#" id="forgotToggle">Forgot password?</a>
            </p>

            <div id="forgotSection" style="display:none;">
                <hr>
                <label>Email for the recovery link</label>
                <div class="auth-forgot-row">
                    <input type="email" id="forgotEmail" autocomplete="email">
                    <button type="button" id="forgotResetBtn">Reset</button>
                </div>
                <p class="auth-hint" id="forgotMsg"></p>
            </div>

        </div>
    </div>

    <div class="page-header-bar">
        <span id="pageGreeting" class="page-greeting">Loading…</span>
        <div class="page-header-clock">
            <span id="pageClockDate"></span><span id="pageClockTime"></span>
        </div>
    </div>
    <div id="pageNavigation" data-page="dashboard"></div>

    <div class="table-container detail-card">

        <div class="reservation-header">
            <div class="header-title"><h3>Dashboard</h3></div>
            <div class="header-center"></div>
            <div class="header-right"></div>
        </div>

        <div class="dash-stack">

            <!-- CARD: My Shift -->
            <section class="dash-section">
                <h3>My Shift</h3>
                <div id="shiftStrip" class="shift-strip">
                    <p class="plan-entry-meta" style="margin:0;">Loading…</p>
                </div>
            </section>

            <!-- CARD: Attendance -->
            <section class="dash-section">
                <h3 id="attTitle">Check In</h3>
                <p id="attSub" class="plan-entry-meta" style="margin-top:2px;">Locating you…</p>

                <div id="map" class="att-map"></div>

                <div class="att-info">
                    <div>
                        <span class="plan-entry-meta">Role</span>
                        <select id="attRole" disabled></select>
                    </div>
                    <div>
                        <span class="plan-entry-meta">Scheduled</span>
                        <strong id="attHours">–</strong>
                    </div>
                    <div>
                        <span class="plan-entry-meta">Elapsed</span>
                        <strong id="attTimer">00:00:00</strong>
                    </div>
                </div>

                <label class="att-label" for="attComment">Comment (optional)</label>
                <textarea id="attComment" rows="2"
                    placeholder="e.g. forgot to check in earlier…"></textarea>

                <button id="attBtn" class="att-btn">Check In</button>
            </section>

            <!-- CARD: History -->
            <section class="dash-section">
                <h3>Recent Entries</h3>
                <div id="myEntriesList"></div>
            </section>

        </div>

    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>
    <script type="module" src="dist/dienstplan.js"></script>
    <script type="module" src="dist/panels.js"></script>
    <script type="module" src="dist/dashboard.js"></script>

</body>
</html>
