<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dienstplan.css">
</head>
<body>

    <h1 id="orgNameLabel">Loading…</h1>
    <div id="pageNavigation" data-page="dashboard"></div>

    <div class="table-container detail-card">

        <div class="reservation-header">
            <div class="header-title"><h3>Dashboard</h3></div>
            <div class="header-menu"></div>
            <div class="header-clock"><span id="clock"></span></div>
        </div>

        <div id="toolbar">
            <div id="normalToolbar">
                <button class="auth-required" onclick="openCheckInModal()">✅ Check In</button>
                <button class="auth-required" onclick="openCheckOutModal()">⏹ Check Out</button>
            </div>
        </div>

        <!-- ponytail: lokasi/kehadiran belum didetailkan, placeholder dulu -->
        <p style="color:#888;">Location check (only allow check-in on-site) — coming soon.</p>

    </div>

    <div id="checkInModal" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal">
            <h3>Check In</h3>
            <label>Note (optional — e.g. if you're checking in late)</label>
            <textarea id="checkInNote" placeholder="e.g. traffic, arrived 10 min late"></textarea>
            <div class="plan-modal-footer">
                <button onclick="closeModal('checkInModal')">Cancel</button>
                <button class="primary" onclick="submitCheckIn()">Submit</button>
            </div>
        </div>
    </div>

    <div id="checkOutModal" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal">
            <h3>Check Out</h3>
            <label>Note (optional — e.g. if you forgot to check in earlier)</label>
            <textarea id="checkOutNote" placeholder="e.g. forgot to check in, started around 9am"></textarea>
            <div class="plan-modal-footer">
                <button onclick="closeModal('checkOutModal')">Cancel</button>
                <button class="primary" onclick="submitCheckOut()">Submit</button>
            </div>
        </div>
    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>
    <script type="module" src="dist/dienstplan.js"></script>
    <script type="module" src="dist/panels.js"></script>

</body>
</html>
