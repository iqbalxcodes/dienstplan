<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan — Schedule</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dienstplan.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal auth-card">

            <h3>Dienstplan Login</h3>

            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="username">

            <label>Password</label>
            <div class="auth-pass-row">
                <input type="password" id="authPassword" autocomplete="current-password">
                <button type="button" class="auth-eye" id="authEyeBtn"
                    title="Show / hide password"
                    aria-label="Show password"></button>
            </div>

            <div class="auth-actions-row">
                <label class="auth-check">
                    <input type="checkbox" id="authRemember" checked>
                    <span>Remember me on this device</span>
                </label>
                <button class="primary" id="authLoginBtn">Log in</button>
            </div>

            <div id="authError" class="auth-error" style="display:none;"></div>

            <p class="auth-hint">No account yet? Please ask your admin / boss, or
                <a href="#" id="forgotToggle">Forgot password?</a>
            </p>

            <div id="forgotSection" style="display:none;">
                <hr>
                <label>Email for the recovery link</label>
                <div class="auth-forgot-row">
                    <input type="email" id="forgotEmail" autocomplete="email">
                    <button type="button" id="forgotResetBtn">Reset</button>
                </div>
                <p class="auth-hint" id="forgotMsg"></p>
            </div>

        </div>
    </div>

    <div class="page-header-bar">
        <span id="pageGreeting" class="page-greeting">Loading…</span>
        <div class="page-header-clock">
            <span id="pageClockDate"></span><span id="pageClockTime"></span>
        </div>
    </div>
    <div id="pageNavigation" data-page="dashboard"></div>

    <div class="table-container detail-card rack-page">

    <div class="reservation-header">
        <div class="header-title"><h3>Schedule</h3></div>

        <div class="header-center">
            <input type="date" id="planDateInput" class="sched-date-input"
                onchange="dienstplan.changeSelectedDate(this.value)">

            <div id="monthNavBar" class="month-nav" style="display:none;">
                <button class="rack-nav-btn" onclick="dienstplan.changeMonth(-1)" title="Previous month">&#9664;</button>
                <select id="monthPickerMonth" class="month-picker-select" onchange="dienstplan.onMonthPickerChange()"></select>
                <select id="monthPickerYear" class="month-picker-select" onchange="dienstplan.onMonthPickerChange()"></select>
                <button class="rack-nav-btn" onclick="dienstplan.changeMonth(1)" title="Next month">&#9654;</button>
            </div>
        </div>

        <div class="header-right">
            <div class="rack-view-toggle" id="rackViewToggle">
                <button class="rack-view-btn" data-mode="month" onclick="dienstplan.planSetViewMode('month')">Month</button>
                <button class="rack-view-btn" data-mode="3" onclick="dienstplan.planSetViewMode('3')">3D</button>
                <button class="rack-view-btn" data-mode="7" onclick="dienstplan.planSetViewMode('7')">7D</button>
                <button class="rack-view-btn" data-mode="30" onclick="dienstplan.planSetViewMode('30')">30D</button>
                <button class="rack-view-btn" data-mode="auto" onclick="dienstplan.planSetViewMode('auto')">Auto</button>
            </div>

            <select id="rackViewSelectMobile" class="rack-view-select-mobile" onchange="dienstplan.planSetViewMode(this.value)">
                <option value="month">Month</option>
                <option value="3">3 Days</option>
                <option value="7">7 Days</option>
                <option value="30">30 Days</option>
                <option value="auto">Auto</option>
            </select>
        </div>
    </div>

        <div class="rack-scroll" id="rackScroll">
            <div id="rackHeaderRow" class="rack-header-row"></div>
            <div id="rackBody"></div>
        </div>

        <div class="month-view" id="monthView" style="display:none;">
            <div id="monthHeaderRow" class="month-header-row"></div>
            <div id="monthGrid" class="month-grid"></div>
        </div>

    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <div id="shiftPopupModal" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal">
            <h3 id="shiftPopupTitle">Edit Shift</h3>

            <div id="shiftPopupStaffName" class="plan-entry-meta" style="margin-bottom:8px;"></div>

            <label id="shiftPopupEmployeeLabel" style="display:none;">Employee</label>
            <select id="shiftPopupEmployee" style="display:none;"></select>

            <label>Role</label>
            <select id="shiftPopupRole"></select>

            <label>Start time</label>
            <input type="time" id="shiftPopupStart">

            <label>End time</label>
            <input type="time" id="shiftPopupEnd">

            <div id="shiftPopupPendingNote" class="plan-entry-meta" style="display:none; margin-top:8px; color:#e65100;"></div>

            <div class="plan-modal-footer">
                <button onclick="dienstplan.closeShiftPopup()">Cancel</button>
                <button id="shiftPopupSaveBtn" class="primary" onclick="dienstplan.submitShiftPopup()">Save</button>
            </div>
        </div>
    </div>

    <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>
    <script type="module" src="dist/dienstplan.js"></script>
    <script type="module" src="dist/panels.js"></script>

</body>
</html>
