<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan — Hours</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dienstplan.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal auth-card">

            <h3>Dienstplan Login</h3>

            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="username">

            <label>Password</label>
            <div class="auth-pass-row">
                <input type="password" id="authPassword" autocomplete="current-password">
                <button type="button" class="auth-eye" id="authEyeBtn"
                    title="Show / hide password"
                    aria-label="Show password"></button>
            </div>

            <div class="auth-actions-row">
                <label class="auth-check">
                    <input type="checkbox" id="authRemember" checked>
                    <span>Remember me on this device</span>
                </label>
                <button class="primary" id="authLoginBtn">Log in</button>
            </div>

            <div id="authError" class="auth-error" style="display:none;"></div>

            <p class="auth-hint">No account yet? Please ask your admin / boss, or
                <a href="#" id="forgotToggle">Forgot password?</a>
            </p>

            <div id="forgotSection" style="display:none;">
                <hr>
                <label>Email for the recovery link</label>
                <div class="auth-forgot-row">
                    <input type="email" id="forgotEmail" autocomplete="email">
                    <button type="button" id="forgotResetBtn">Reset</button>
                </div>
                <p class="auth-hint" id="forgotMsg"></p>
            </div>

        </div>
    </div>

    <div class="page-header-bar">
        <span id="pageGreeting" class="page-greeting">Loading…</span>
        <div class="page-header-clock">
            <span id="pageClockDate"></span><span id="pageClockTime"></span>
        </div>
    </div>
    <div id="pageNavigation" data-page="hours"></div>

    <div class="table-container detail-card">

        <div class="reservation-header">
            <div class="header-title"><h3>Hours</h3></div>
            <div class="header-center"></div>
            <div class="header-right"></div>
        </div>

        <div id="toolbar">
            <div id="normalToolbar">
                <button class="auth-required" onclick="openLeaveModal('freiwunsch')">📅 Freiwunsch</button>
                <button class="auth-required" onclick="openLeaveModal('urlaub')">🏖 Urlaub</button>
            </div>
        </div>

        <div id="hoursSummaryPanel"></div>

    </div>

    <div id="leaveModal" class="plan-modal-backdrop" style="display:none;">
        <div class="plan-modal">
            <h3 id="leaveModalTitle">Request Leave</h3>
            <input type="hidden" id="leaveType">
            <label>From</label>
            <input type="date" id="leaveDateStart">
            <label>To</label>
            <input type="date" id="leaveDateEnd">
            <label>Reason (optional)</label>
            <textarea id="leaveReason"></textarea>
            <div class="plan-modal-footer">
                <button onclick="closeModal('leaveModal')">Cancel</button>
                <button class="primary" onclick="submitLeaveRequestForm()">Submit</button>
            </div>
        </div>
    </div>

    <div id="statusBar">
        <div id="userArea"></div>
        <div id="contextArea"></div>
        <div id="paginationInfo"></div>
        <div id="paginationNav"></div>
    </div>

    <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>
    <script type="module" src="dist/dienstplan.js"></script>
    <script type="module" src="dist/panels.js"></script>

</body>
</html>
